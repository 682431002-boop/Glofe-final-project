<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>GloFe — Product</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- ================= HEADER ================= -->

  <header class="header">

    <div class="container nav">

      <a
        class="brand"
        href="index.html"
      >

        <img src="assets/images/โล.png" alt="GloFe Logo" class="brand-logo"></a>
    <span><b>GloFe</b><small> GLOBAL PRE-ORDER</small></span></a>

          


      <nav>

        <a href="index.html">
          Home
        </a>

        <a href="index.html#shop">
          Shop
        </a>

        <a href="wishlist.html">
          Wishlist
        </a>

        <a href="account.html">
          My Account
        </a>

      </nav>


      <div class="nav-tools">

        <a
          class="cart-pill"
          href="cart.html"
        >

          🛒 Cart

          <i id="cartCount">
            0
          </i>

        </a>

      </div>

    </div>

  </header>



  <!-- ================= MAIN ================= -->

  <main>


    <!-- PAGE TITLE -->

    <section class="page-title">

      <div class="container">

        <p class="eyebrow">
          PRODUCT DETAIL
        </p>

        <h1 id="title">
          Product
        </h1>

      </div>

    </section>



    <!-- PRODUCT DETAIL -->

    <section class="container product-detail">


      <!-- PRODUCT IMAGE -->

      <div class="product-large">

        <img
          id="photo"
          src="assets/images/product-1.svg"
          alt=""
        >

        <button
          id="wish"
          class="wish-large"
        >
          ♡
        </button>

      </div>



      <!-- PRODUCT INFORMATION -->

      <div class="detail-copy">


        <p
          id="country"
          class="eyebrow"
        ></p>


        <h2 id="name"></h2>


        <div
          id="price"
          class="price"
        ></div>


        <p
          id="deadline"
          class="muted"
        ></p>


        <p id="desc"></p>


        <!-- TAGS -->

        <div
          id="tags"
          class="tags"
        ></div>



        <!-- ================= SIZE ================= -->

        <div
          class="size-selector"
          id="size-selector"
        >

          <label>
            Select Size
          </label>

          <div
            id="size-options"
            class="size-options"
          ></div>

        </div>



        <!-- ================= QUANTITY ================= -->

        <div class="option-box">


          <b>
            Quantity
          </b>


          <div class="qty">


            <button
              id="minus"
              type="button"
            >
              −
            </button>


            <input
              id="qty"
              value="1"
              min="1"
              type="number"
            >


            <button
              id="plus"
              type="button"
            >
              +
            </button>


          </div>



          <!-- ADD TO CART -->

          <button
            id="add"
            class="btn dark full"
            type="button"
          >
            Add to cart
          </button>



          <!-- BUY NOW -->

          <button
            id="buy"
            class="btn ghost full"
            type="button"
          >
            Buy now
          </button>


        </div>


      </div>


    </section>


  </main>



  <!-- ================= FOOTER ================= -->

  <footer class="footer">

    <div class="container footer-bottom">

      © 2026 GloFe · Educational demo

    </div>

  </footer>



  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
  ></div>



  <!-- JAVASCRIPT -->

  <script src="app.js"></script>

</body>

</html>
